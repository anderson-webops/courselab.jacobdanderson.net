# Static routing template for the existing application installation.
# Host-managed tokens represent the selected accepted artifact and TLS policy.
# All names share one root; canonical document URLs are application metadata.
server {
    listen 80;
    listen [::]:80;
    server_name courselab.jacobdanderson.net learn.jacobdanderson.net orbitalhw.jacobdanderson.net;
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name courselab.jacobdanderson.net learn.jacobdanderson.net orbitalhw.jacobdanderson.net;

    root __EXISTING_APPLICATION_ACCEPTED_DIST__;
    index index.html;
    ssl_certificate __HOST_MANAGED_FULLCHAIN_FOR_ALL_NAMES__;
    ssl_certificate_key __HOST_MANAGED_PRIVATE_KEY_FOR_ALL_NAMES__;
    include __HOST_MANAGED_TLS_POLICY__;

    location / {
        try_files $uri $uri/ =404;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cache-Control no-cache;
    }
}
